version: 2
updates:
  # Actions are pinned to commit SHAs; Dependabot proposes the new SHA.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # Minor and patch updates arrive together in one weekly pull request.
  # Major updates get their own pull request each.
  # SheetJS is installed from its own tarball, not the npm registry, so
  # Dependabot does not see it; check it by hand (see docs/development.md).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    ignore:
      # vue-tsc needs the JavaScript compiler API that TypeScript 7 removed.
      # Remove this rule once vue-tsc supports TypeScript 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Node's type definitions follow the Node version in .nvmrc (24).
      # Raise them together with .nvmrc, by hand.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
